framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    trusted_proxies: 'private_ranges,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']
    session:
        handler_id: session.pdo_handler
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        name: ttt_sid
    php_errors:
        log: true

when@test:
    framework:
        test: true
