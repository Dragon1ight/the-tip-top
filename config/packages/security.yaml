security:
    password_hashers:
        App\Security\AppUser:
            algorithm: argon2id
    providers:
        app_users:
            id: App\Security\AppUserProvider
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_HUISSIER]
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets|vendor)/
            security: false
        main:
            lazy: true
            provider: app_users
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: home
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/journal-tirage, roles: ROLE_HUISSIER }
        - { path: ^/boutique, roles: ROLE_EMPLOYE }
        - { path: ^/(mes-participations|mes-donnees|jouer-en-attente), roles: ROLE_PARTICIPANT }

when@test:
    security:
        password_hashers:
            App\Security\AppUser:
                algorithm: argon2id
                memory_cost: 8
                time_cost: 1
