global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"] }]
  - job_name: site
    metrics_path: /probe
    params: { module: [http_cold_start] }
    # /sante interroge la base : une sonde fréquente garderait Render et MariaDB Cloud
    # éveillés en permanence et épuiserait leurs quotas gratuits.
    scrape_interval: 30m
    scrape_timeout: 95s
    file_sd_configs:
      - files: [/targets/site-target.json]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
