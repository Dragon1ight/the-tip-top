# Environnement DEV ou PREPROD : même image que la production, base MariaDB locale.
# Variables fournies par /opt/ttt-<env>.env sur le VPS (jamais versionné).
services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?}
      SITE_ENV: ${SITE_ENV:?}
      SITE_URL: https://${HOST:?}
      DATABASE_URL: mysql://ttt:${DB_PASSWORD:?}@db:3306/ttt
      API_HMAC_SECRET: ${API_HMAC_SECRET:?}
      GAME_FORCE_OPEN: "1"
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      CODES_AUTOGEN: "5000"
    depends_on:
      db: { condition: service_healthy }
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.ttt-${COMPOSE_PROJECT_NAME}.rule=Host(`${HOST}`)
      - traefik.http.routers.ttt-${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.ttt-${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.ttt-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=10000
  db:
    image: mariadb:11
    restart: unless-stopped
    environment: { MARIADB_DATABASE: ttt, MARIADB_USER: ttt, MARIADB_PASSWORD: "${DB_PASSWORD:?}", MARIADB_RANDOM_ROOT_PASSWORD: "1" }
    volumes: [db:/var/lib/mysql]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 3s, retries: 30 }
volumes: { db: {} }
networks:
  proxy: { external: true }
