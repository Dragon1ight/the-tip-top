jenkins:
  systemMessage: "Workflow Furious Ducks"
  numExecutors: 3
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: ${JENKINS_URL:-http://localhost:8080/}
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: render-api-key
              scope: GLOBAL
              secret: ${RENDER_API_KEY:-none}
          - usernamePassword:
              id: github-bot
              scope: GLOBAL
              username: ${GITHUB_USER:-jenkins-bot}
              password: ${GITHUB_TOKEN:-none}
jobs:
  - file: /usr/share/jenkins/casc/jobs.groovy
